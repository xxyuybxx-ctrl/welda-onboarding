  --line:#DDD8F6;      /* 덱 카드 테두리 */
  --title:#2A2FA3;     /* 덱 제목색 */
  --ink:#14186E;       /* 덱 항목 제목 */
  --body:#4B5599;      /* 덱 본문 */
  --sub:#5D67A4;
  --muted:#9AA2D6;
  --accent:#7664F3;
  --step:#8377E5;
  --pill:#E8EDFF; --pill-ink:#5B55D6;
  --f:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100%}
/* 목차 */
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 28px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .hex{width:28px;height:28px;flex:none}
.brand b{display:block;font-size:15px;font-weight:800;color:var(--title);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--sub)}
.ch{margin:0 0 10px}
.ch-h{display:flex;align-items:baseline;gap:8px;padding:6px 8px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ch-h strong{font-size:14px;color:var(--title);letter-spacing:-.01em;text-transform:none}
.ch ol{list-style:none;margin:0;padding:0}
.ch li button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:baseline;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.4;color:var(--body);cursor:pointer}
.ch li button:hover{background:#F6F5FD}
.ch li button[aria-current="true"]{background:#EEEBFD;color:var(--ink);font-weight:700}
.ch li .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.ch li button[aria-current="true"] .no{color:var(--accent)}
/* 본문 */
main{padding:20px clamp(16px,3vw,40px) 40px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.where{display:flex;align-items:center;gap:10px;min-width:0}
.chip{display:inline-block;background:var(--pill);color:var(--pill-ink);font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.where h1{margin:0;font-size:clamp(17px,2vw,22px);font-weight:800;color:var(--title);letter-spacing:-.03em;text-wrap:balance}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--step)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.nav:focus-visible,.ch li button:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%;box-shadow:0 6px 24px rgba(20,24,110,.08)}
.stage img{display:block;width:100%;height:100%;object-fit:contain;user-select:none}
.nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:var(--title);font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(42,47,163,.15);display:grid;place-items:center}
.nav.prev{left:12px}.nav.next{right:12px}
.nav:disabled{opacity:.3;cursor:default}
.counter{position:absolute;right:12px;bottom:12px;background:rgba(20,24,110,.72);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.info{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.info p{margin:0;font-size:15px;line-height:1.8;color:var(--body);max-width:40ch;white-space:pre-line}
.info .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#F6F5FD;color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;scroll-snap-type:x proximity}
.thumb{flex:none;width:150px;border:2px solid transparent;border-radius:9px;padding:0;background:var(--panel);cursor:pointer;scroll-snap-align:start;overflow:hidden}
.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.thumb span{display:block;font-size:11px;color:var(--sub);padding:4px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb[aria-current="true"]{border-color:var(--accent)}
/* 전체 보기 */
.grid{display:none}
body.gridmode .viewer{display:none}
body.gridmode .grid{display:block}
.grid section{margin:0 0 26px}
.grid h2{font-size:15px;font-weight:800;color:var(--title);margin:0 0 10px;letter-spacing:-.02em}
.grid h2 small{font-size:12px;color:var(--muted);font-weight:700;margin-right:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cards .thumb{width:auto}
/* 모바일 */
.chsel{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .chsel{display:block;width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin-bottom:12px}
  .where{flex-direction:column;align-items:flex-start;gap:6px}
  .info{grid-template-columns:1fr}
  .info .tags{justify-content:flex-start}
  .nav{width:36px;height:36px;font-size:16px}
}
/* 발표 모드 */
body.present{background:#0E1040;overflow:hidden}
body.present aside,body.present .top,body.present .info,body.present .strip,body.present .chsel,body.present .grid{display:none!important}
body.present .viewer{display:block}
body.present main{padding:0}
body.present .stage{position:fixed;inset:0;margin:auto;width:min(100vw,177.78vh);height:auto;border:0;border-radius:0;box-shadow:none;background:#0E1040}
@media (prefers-reduced-motion:no-preference){.stage img{transition:opacity .15s}}

<script>
const CH = [
  {id:'intro', label:'시작', name:'표지 · 목차'},

  {id:'c5', label:'Chapter 5', name:'FAQ'},

];
const S = [
 ['intro','표지',"웰다(Welda) 표지입니다.\n\n혈당 데이터 기반 생활습관 관리 프로그램,\n내일을 바꾸는 대사 건강 솔루션입니다.",['표지']],
 ['intro','목차',"전체 구성입니다.\n\n• 1장 프로그램 개요\n• 2장 상담 개요\n• 3장 첫방문 프로토콜\n• 4장 재방문 프로토콜\n• 5장 FAQ\n• 마무리 도입 절차",['목차']],
 ['c1','Chapter 1 · 프로그램 개요',"1장 간지입니다.",['간지']],
 ['c1','웰다는 혈당 데이터 기반 대사 건강 솔루션입니다',"웰다가 무엇인지 보여 주는 장입니다.\n\n환자는 앱에 기록하고,\n의원은 웰다 Pro로 확인합니다.\n\n세 환자군 모두\n기록 → 확인 → 지속의 같은 흐름입니다.",['원장 제안']],
 ['c1','환자가 기록하면, 진료실에서 바로 봅니다',"환자가 앱에 식사 · 운동을 기록합니다.\n\n진료실 PC에서 실시간으로 확인하고\n다음 진료 상담에 활용합니다.",['화면']],
 ['c1','서울시가 선택한 혈당관리 프로그램, 웰다',"서울시 「혈당캐치9988」 협력사업자로\n대웅제약 웰다가 선정되었습니다.\n\n공개 모집에서 4개 기업 제안서를\n평가한 결과입니다.\n\n• 당뇨 전단계 서울시민 1,000명\n• 25개 자치구 보건소 연계\n\n공공 평가를 거친 프로그램을\n의원 · 병원에서 바로 권할 수 있습니다.",['원장 제안','신뢰']],
 ['c1','보건소에서 시작된 웰다, 다음은 의원 · 병원입니다',"보건소 검사로 확인된\n당뇨 전단계 시민이 웰다를 시작합니다.\n\n1. 보건소 대사증후군 검사\n2. 손목닥터9988 신청\n3. 웰다 키트 배송\n4. 착용 · 교육 · 상담\n\n서울시 사업과 의원 · 병원을\n표로 비교했습니다.\n\n대상 기준 · 프로그램은 같고,\n의원 · 병원은 인원 제한이 없습니다.",['원장 제안','신뢰']],
 ['c1','외래에서 이런 환자에게 권해 주세요',"웰다를 권할 세 환자군입니다.\n\n• 당뇨전단계\n• GLP-1 계열 투약 환자\n• 생활습관 개선군\n\n군별 대상 기준과\n핵심 포인트를 함께 담았습니다.\n\n• 약보다 먼저, 생활습관 관리\n• 단약 이후를 미리 준비\n• 앱 기록부터 가볍게 시작",['원장 제안']],
 ['c1','BD 1장만 나눠 주시면, 환자 연결은 웰다가 이어갑니다',"의원이 할 일은 BD 1장 건네기입니다.\n\n1. 진료 중 BD 전달\n2. 환자가 QR로 앱 설치\n3. 가입 후 의원 파트너 코드 입력\n4. 의원 웰다 Pro에 연결\n\n비만주사 · 전당뇨/당뇨 두 버전이 있고,\n의원 코드는 빨간 글씨로 인쇄됩니다.",['원장 제안','운영']],
 ['c1','기록이 쌓일수록, 환자도 의원도 얻습니다',"환자득 · 병원득을\n하나의 관리 루프로 보여 줍니다.\n\n환자 기록 → 의원 확인\n→ 데이터 상담 → 재방문\n\n환자: 체중 유지 관리, 생활습관 개선,\n맞춤 관리, 혈당 변화 확인\n\n의원: 신뢰 형성, 재방문 유도,\n차별화된 진료, 무료 도입 · 추가 수익",['원장 제안']],
 ['c1','무료 도입 · 추가 수익',"웰다는 무료로 도입합니다.\n\n연속혈당측정기 활용 시\n환자 1명당 3.8~6.8만원이 남습니다.\n\n환자 100명 기준\n최대 675만원의 추가 수익입니다.",['원장 제안','수치']],
 ['c1','비만주사 치료, 처방만으로 충분할까요?',"처방만으로는 부족한 이유 세 가지입니다.\n\n• 가격 경쟁으로 인한 환자 이탈\n• 주사 중단 후 요요\n• 생활습관 관리의 필요성\n\n오른쪽 그래프는\n생활습관 병행 여부에 따른 체중 변화입니다.",['원장 제안']],
 ['c1','웰다 프로그램',"웰다 프로그램의 4단계입니다.\n\n1. 웰다 가입\n2. 생활습관 기록\n3. 재방문 상담\n4. 센서 부착",['원장 제안']],
 ['c2','Chapter 2 · 상담 개요',"2장 간지입니다.",['간지']],
 ['c2','프로그램 시작과 점검',"첫방문과 재방문에서\n다루는 항목을 한눈에 보여 줍니다.\n\n• 첫방문: 온보딩\n• 재방문: 점검\n\n연속혈당측정기 부착은\n필요한 환자만 하는 선택 사항입니다.",['구조']],
 ['c2','환자는 2주마다 센서 교체, 4주마다 상담으로 내원합니다',"환자의 내원 주기입니다.\n\n• 2주마다 센서 교체\n• 4주마다 상담\n\n센서 부착 시점은 두 가지입니다.\n\n• 경로 A: 첫 내원 당일\n• 경로 B: 앱 기록 후 다음 내원",['운영']],
 ['c3','Chapter 3 · 첫방문 프로토콜',"3장 간지입니다.",['간지']],
 ['c3','웰다 시작하기',"웰다 시작 3단계입니다.\n\n1. 웰다 앱 세팅\n2. 건강 상태 입력\n3. 웰다 여정 시작\n\n사전 체크리스트 QR도 함께 있습니다.",['환자 안내']],
 ['c3','의원: 파트너 링크 발송 (웰다 Pro)',"웰다 Pro 유저 관리에서\n파트너 링크를 발송하는 화면입니다.",['스태프']],
 ['c3','환자가 받는 알림톡',"환자가 받는 카카오 알림톡과\n앱 설치 링크입니다.",['스태프']],
 ['c3','환자 앱 온보딩, 4단계로 진행합니다',"환자가 앱에서 거치는 순서입니다.\n\n1. 웰다 앱 설치\n2. 사전 설문\n3. 목표 · 현재 허리둘레 입력\n4. 리브레 앱 설치 · 연동\n\n4단계는 센서를 부착하는 환자만 진행합니다.\n\n문의 채널(채널톡 웰다)도 함께 안내합니다.",['환자 안내']],
 ['c3','웰다 앱 설치 · 회원가입',"QR로 앱을 받고 회원가입합니다.\n\n파트너 코드가 있으면\n가입 후 입력합니다.\n\n사전 문진까지 이어서 진행합니다.",['환자 안내']],
 ['c3','사전 문진 미통과 기준',"사전 문진 기준에 해당하면\n가입이 제한됩니다.\n\n대상 기준과 승인 화면입니다.",['안전']],
 ['c3','사전 설문 진행',"사전 설문은 4개 섹션입니다.\n\n웰다 참여 목적 · 기본 정보\n생활 습관 · 증상 체크\n\n응답을 바탕으로\nAI 코치가 맞춤 조언을 드립니다.",['환자 안내']],
 ['c3','목표 · 현재 허리둘레 입력',"목표를 정하고\n현재 허리둘레를 입력합니다.\n\ncm 또는 바지 사이즈(inch)로\n입력할 수 있습니다.",['환자 안내']],
 ['c3','센서 연동 준비 (웰다 앱 안내)',"키트를 받은 뒤\n웰다 앱 안내에 따라\n센서 연동을 준비합니다.\n\n여정 챕터 또는 홈 화면에서\n시작할 수 있습니다.",['스태프']],
 ['c3','리브레 앱 설치 · 계정 생성',"리브레 앱을 설치하고\n계정을 만듭니다.\n\n측정 단위 mg/dL,\n탄수화물 단위는 그램으로 설정합니다.",['스태프']],

const N = S.length;
const $ = id => document.getElementById(id);
let cur = 0;

function slideBtn(i, cls){
  const b = document.createElement('button'); b.type='button'; b.className = cls; b.dataset.i = i;
  b.addEventListener('click', () => { if (document.body.classList.contains('gridmode')) setGrid(false); go(i); });
  return b;
}
// 목차
CH.forEach(c => {
  const idx = S.map((s,i)=>s[0]===c.id?i:-1).filter(i=>i>=0);
  const box = document.createElement('div'); box.className='ch';
  box.innerHTML = `<div class="ch-h">${c.label}<strong>${c.name}</strong></div>`;
  const ol = document.createElement('ol');
  idx.forEach(i => { const li=document.createElement('li'); const b=slideBtn(i,''); b.innerHTML=`<span class="no">${String(i+1).padStart(2,'0')}</span><span>${S[i][1]}</span>`; li.appendChild(b); ol.appendChild(li); });
  box.appendChild(ol); $('toc').appendChild(box);
  const o=document.createElement('option'); o.value=idx[0]; o.textContent=`${c.label} · ${c.name} (${idx[0]+1}~${idx[idx.length-1]+1})`; $('chsel').appendChild(o);
  // 전체 보기
  const sec=document.createElement('section'); sec.innerHTML=`<h2><small>${c.label}</small>${c.name}</h2>`;
  const cards=document.createElement('div'); cards.className='cards';
  idx.forEach(i=>{ const b=slideBtn(i,'thumb'); b.innerHTML=`<img loading="lazy" src="thumbs/t${String(i+1).padStart(2,'0')}.jpg" alt=""><span>${i+1}. ${S[i][1]}</span>`; cards.appendChild(b); });
  sec.appendChild(cards); $('grid').appendChild(sec);
});
$('chsel').addEventListener('change', e => go(+e.target.value));

function go(i){
  cur = Math.max(0, Math.min(N-1, i));
  const s = S[cur], c = CH.find(c=>c.id===s[0]), n2 = String(cur+1).padStart(2,'0');
  $('img').src = `slides/s${n2}.jpg`; $('img').alt = `${cur+1}장: ${s[1]}`;
  $('ttl').textContent = s[1]; $('chip').textContent = `${c.label} · ${c.name}`;
  $('desc').textContent = s[2];
  $('tags').innerHTML = s[3].map(t=>`<span class="tag">${t}</span>`).join('');
  $('cnt').textContent = `${cur+1} / ${N}`;
  $('prev').disabled = cur===0; $('next').disabled = cur===N-1;
  document.querySelectorAll('#toc button, .cards .thumb').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i===cur)));
  $('chsel').value = [...$('chsel').options].reverse().find(o=>+o.value<=cur).value;
  // 같은 장 썸네일
  const strip=$('strip'); strip.innerHTML='';
  S.forEach((x,j)=>{ if(x[0]!==s[0]) return; const b=slideBtn(j,'thumb'); b.setAttribute('aria-current',String(j===cur)); b.innerHTML=`<img loading="lazy" src="thumbs/t${String(j+1).padStart(2,'0')}.jpg" alt=""><span>${j+1}. ${x[1]}</span>`; strip.appendChild(b); });
  const act = strip.querySelector('[aria-current="true"]'); if (act) act.scrollIntoView({block:'nearest',inline:'nearest'});
  const tocAct = document.querySelector('#toc [aria-current="true"]'); if (tocAct) tocAct.scrollIntoView({block:'nearest'});
  try { history.replaceState(null,'',`#s${cur+1}`); } catch(e){}
  if (cur+1<N){ const pre=new Image(); pre.src=`slides/s${String(cur+2).padStart(2,'0')}.jpg`; }
}
function setGrid(on){ document.body.classList.toggle('gridmode',on); $('btn-grid').classList.toggle('on',on); $('btn-grid').setAttribute('aria-pressed',String(on)); $('btn-grid').textContent = on?'슬라이드 보기':'전체 보기'; }
$('btn-grid').addEventListener('click', ()=> setGrid(!document.body.classList.contains('gridmode')));
$('prev').addEventListener('click', ()=>go(cur-1));
$('next').addEventListener('click', ()=>go(cur+1));
function present(on){
  document.body.classList.toggle('present', on);
  if (on){ setGrid(false); const r=document.documentElement; if(r.requestFullscreen) r.requestFullscreen().catch(()=>{}); }
  else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
$('btn-present').addEventListener('click', ()=>present(true));
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')) present(false); });
$('img').addEventListener('click', ()=>{ if(document.body.classList.contains('present')) go(cur+1); });
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='SELECT') return;
  if (['ArrowRight','PageDown'].includes(e.key) || (e.key===' ' && document.body.classList.contains('present'))){ e.preventDefault(); go(cur+1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if (e.key==='Escape' && document.body.classList.contains('present')) present(false);
});
// 스와이프
let sx=null; $('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(cur+(dx<0?1:-1)); sx=null; });
const m = location.hash.match(/^#s(\d+)$/);
go(m ? (+m[1]-1) : 0);
</script>
</body></html>
